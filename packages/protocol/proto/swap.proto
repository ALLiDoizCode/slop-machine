// Nillion Micropayment Protocol - Cross-Chain Swap Messages
// Version: 1.0.0
// Protocol Buffers v3

syntax = "proto3";

package nillion.payment.v1;

import "common.proto";

// ============================================================================
// SWAP INITIATION
// ============================================================================

// Client → Server: Initiate cross-chain atomic swap
message InitiateSwapRequest {
  ChainType source_chain_id = 1;
  ChainType destination_chain_id = 2;
  string source_amount = 3; // bigint as string
  double max_slippage_percent = 4; // Max acceptable rate deviation (default: 1.0)
  int32 timeout_seconds = 5; // HTLC timeout (default: 1800 = 30 min)
}

// Server → Client: Exchange rate quote
message SwapQuote {
  string quote_id = 1; // UUID (expires in 30 seconds)
  ChainType source_chain_id = 2;
  ChainType destination_chain_id = 3;
  string source_amount = 4; // bigint as string
  string destination_amount = 5; // bigint as string (estimated)
  double exchange_rate = 6; // e.g., 0.000033 BTC/ETH
  string total_fees = 7; // bigint as string (combined gas costs)
  int64 rate_expires_at = 8; // Unix timestamp milliseconds
  OracleInfo oracle = 9;
}

message OracleInfo {
  string oracle_name = 1; // "Chainlink" | "Pyth Network"
  double price = 2; // USD price
  double confidence = 3; // Confidence interval (%)
  int64 last_updated = 4; // Oracle update timestamp
}

// Client → Server: Accept quote and execute swap
message ExecuteSwapRequest {
  string quote_id = 1;
  bool confirmed = 2; // Must be true (explicit user confirmation)
}

// Server → Client: Swap execution started
message ExecuteSwapResponse {
  string swap_id = 1; // UUID
  SwapStatus status = 2; // "INITIATED"
  string htlc_hash = 3; // SHA256 hash (public)
  int64 expires_at = 4; // HTLC timeout
}

// ============================================================================
// SWAP QUERIES
// ============================================================================

// Client → Server: Get swap details
message GetSwapRequest {
  string swap_id = 1;
}

// Server → Client: Swap details
message GetSwapResponse {
  Swap swap = 1;
}

message Swap {
  string id = 1;
  ChainType source_chain_id = 2;
  ChainType destination_chain_id = 3;
  string source_channel_id = 4;
  string destination_channel_id = 5;
  string user_id = 6;
  string source_amount = 7; // bigint as string
  string destination_amount = 8; // bigint as string
  double exchange_rate = 9;
  string htlc_hash = 10; // Public hash
  SwapStatus status = 11;
  string source_tx_hash = 12;
  string destination_tx_hash = 13;
  int64 expires_at = 14;
  int64 created_at = 15;
  int64 completed_at = 16; // 0 if not completed
}

// ============================================================================
// SWAP EVENTS (Server-Initiated)
// ============================================================================

// Server → Client: Swap status updates
message SwapStatusUpdate {
  string swap_id = 1;
  SwapStatus status = 2;
  int64 timestamp = 3;
  SwapPhaseInfo phase_info = 4;
}

message SwapPhaseInfo {
  oneof phase {
    SourceLockPhase source_lock = 1;
    DestinationLockPhase destination_lock = 2;
    CompletionPhase completion = 3;
    RefundPhase refund = 4;
  }
}

message SourceLockPhase {
  string tx_hash = 1;
  int32 confirmations = 2;
  int32 confirmations_required = 3;
}

message DestinationLockPhase {
  string tx_hash = 1;
  int32 confirmations = 2;
  int32 confirmations_required = 3;
}

message CompletionPhase {
  string source_tx_hash = 1;
  string destination_tx_hash = 2;
  bytes revealed_secret = 3; // HTLC preimage
  int64 completed_at = 4;
}

message RefundPhase {
  string reason = 1; // "TIMEOUT" | "SOURCE_LOCK_FAILED" | "DEST_LOCK_FAILED"
  string refund_tx_hash = 2;
  int64 refunded_at = 3;
}

// Server → Client: Swap completed successfully
message SwapCompleted {
  string swap_id = 1;
  string source_tx_hash = 2;
  string destination_tx_hash = 3;
  string source_amount = 4; // Final amount (may differ slightly from quote)
  string destination_amount = 5;
  int64 completed_at = 6;
}

// Server → Client: Swap failed
message SwapFailed {
  string swap_id = 1;
  ErrorCode error_code = 2;
  string error_message = 3;
  SwapStatus final_status = 4; // "REFUNDED" or "FAILED"
  int64 timestamp = 5;
}
