// Nillion Micropayment Protocol - Authentication Messages
// Version: 1.0.0
// Protocol Buffers v3

syntax = "proto3";

package nillion.payment.v1;

import "common.proto";

// ============================================================================
// AUTHENTICATION FLOW
// ============================================================================

// Server → Client: Challenge for SIWE authentication
message AuthChallenge {
  string challenge = 1; // Random nonce (32 bytes hex)
  int64 timestamp = 2; // Unix timestamp milliseconds
  int32 version = 3; // Protocol version (1)
}

// Client → Server: Signed response
message AuthResponse {
  string ethereum_address = 1; // 0x-prefixed hex (42 chars)
  string signature = 2; // ECDSA signature of challenge (hex)
  string bitcoin_address = 3; // Optional: Lightning pubkey
  string solana_address = 4; // Optional: Solana pubkey (base58)
  string client_version = 5; // SDK version (e.g., "client-sdk@1.0.0")
}

// Server → Client: Authentication successful
message AuthSuccess {
  string user_id = 1; // UUID
  string session_id = 2; // UUID
  string jwt_token = 3; // For REST API authentication
  int64 token_expires_at = 4; // Unix timestamp milliseconds
  User user = 5; // User details
}

// Server → Client: Authentication failed
message AuthFailure {
  ErrorCode error_code = 1;
  string message = 2;
  int32 retry_after_seconds = 3; // Backoff time if rate limited
}

// ============================================================================
// SESSION MANAGEMENT
// ============================================================================

// Client → Server: Heartbeat to keep session alive
message Heartbeat {
  string session_id = 1;
  int64 timestamp = 2; // Unix timestamp milliseconds
}

// Server → Client: Heartbeat acknowledgment
message HeartbeatAck {
  string session_id = 1;
  int64 server_timestamp = 2;
  int32 next_heartbeat_seconds = 3; // Recommended interval (default: 30s)
}

// Server → Client: Session expired warning
message SessionExpiring {
  string session_id = 1;
  int64 expires_at = 2; // Unix timestamp milliseconds
  int32 seconds_remaining = 3;
}

// Client → Server: Refresh session
message RefreshSession {
  string session_id = 1;
  string jwt_token = 2; // Current token
}

// Server → Client: New token issued
message SessionRefreshed {
  string jwt_token = 1;
  int64 token_expires_at = 2;
}
