// Nillion Micropayment Protocol - Channel Management Messages
// Version: 1.0.0
// Protocol Buffers v3

syntax = "proto3";

package nillion.payment.v1;

import "common.proto";

// ============================================================================
// CHANNEL CREATION
// ============================================================================

// Client → Server: Create new payment channel
message CreateChannelRequest {
  ChainType chain_id = 1;
  string counterparty_address = 2; // Blockchain address (format varies by chain)
  string capacity = 3; // bigint as string (wei/satoshi/lamport)
  string settlement_threshold = 4; // bigint as string (monetary threshold for auto-settlement)
  map<string, string> chain_specific_params = 5; // Optional chain-specific configuration
}

// Server → Client: Channel creation response
message CreateChannelResponse {
  string channel_id = 1; // UUID
  string on_chain_channel_id = 2; // Chain-specific ID (Vector address, LN channel point, Solana pubkey)
  ChannelStatus status = 3; // Usually "OPENING"
  string on_chain_tx_hash = 4; // Opening transaction hash
  VoucherPool voucher_pool = 5; // Pre-signed vouchers (100)
  int64 estimated_confirmation_seconds = 6; // Blockchain confirmation ETA
}

// ============================================================================
// CHANNEL QUERIES
// ============================================================================

// Client → Server: Get channel details
message GetChannelRequest {
  string channel_id = 1; // UUID
}

// Server → Client: Channel details
message GetChannelResponse {
  Channel channel = 1;
  VoucherPool active_pool = 2;
  ChannelStats stats = 3;
}

message Channel {
  string id = 1; // UUID
  ChainType chain_id = 2;
  string channel_id = 3; // On-chain identifier
  string opener_address = 4;
  string counterparty_address = 5;
  ChannelStatus status = 6;
  string capacity = 7; // bigint as string
  string local_balance = 8; // bigint as string
  string remote_balance = 9; // bigint as string
  int32 nonce = 10;
  string settlement_threshold = 11; // bigint as string
  string on_chain_tx_hash = 12;
  int64 created_at = 13;
  int64 last_activity_at = 14;
  int64 closed_at = 15; // Optional, 0 if not closed
}

message ChannelStats {
  int32 total_payments = 1;
  string total_volume = 2; // bigint as string
  int32 avg_latency_ms = 3;
  double success_rate = 4; // Percentage (0-100)
}

// ============================================================================
// CHANNEL UPDATES (Server-Initiated)
// ============================================================================

// Server → Client: Real-time channel state update
message ChannelUpdate {
  string channel_id = 1;
  ChannelStatus status = 2;
  string local_balance = 3; // bigint as string
  string remote_balance = 4; // bigint as string
  int32 nonce = 5;
  int64 timestamp = 6;
  UpdateReason reason = 7;
}

enum UpdateReason {
  UPDATE_REASON_UNSPECIFIED = 0;
  PAYMENT_PROCESSED = 1;
  CHANNEL_CONFIRMED = 2; // Blockchain confirmation received
  SETTLEMENT_INITIATED = 3;
  SETTLEMENT_CONFIRMED = 4;
  CHANNEL_CLOSING = 5;
}

// ============================================================================
// CHANNEL CLOSURE
// ============================================================================

// Client → Server: Request channel closure
message CloseChannelRequest {
  string channel_id = 1;
  bool force_close = 2; // True = immediate close (may incur penalties)
}

// Server → Client: Channel closure initiated
message CloseChannelResponse {
  string channel_id = 1;
  ChannelStatus new_status = 2; // "CLOSING"
  string settlement_tx_hash = 3; // Final settlement transaction
  int64 estimated_finalization_seconds = 4;
}

// ============================================================================
// VOUCHER POOL MANAGEMENT
// ============================================================================

// Server → Client: Voucher pool status update
message VoucherPoolStatus {
  string channel_id = 1;
  string pool_id = 2;
  int32 unused_vouchers = 3;
  int32 total_vouchers = 4;
  bool regeneration_needed = 5; // True if < 10 vouchers remain
  int64 pool_expires_at = 6; // When oldest voucher expires
}

// Client → Server: Request new voucher pool
message RegenerateVoucherPoolRequest {
  string channel_id = 1;
}

// Server → Client: New pool created
message RegenerateVoucherPoolResponse {
  VoucherPool new_pool = 1;
  int64 generation_time_ms = 2; // How long MPC signing took
}

// ============================================================================
// LIST CHANNELS
// ============================================================================

// Client → Server: List all channels for user
message ListChannelsRequest {
  ChainType chain_filter = 1; // Optional: filter by chain
  ChannelStatus status_filter = 2; // Optional: filter by status
  int32 page = 3; // Pagination
  int32 limit = 4; // Max 100
}

// Server → Client: Channel list
message ListChannelsResponse {
  repeated Channel channels = 1;
  Pagination pagination = 2;
}

message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int32 total = 3;
  int32 total_pages = 4;
}
