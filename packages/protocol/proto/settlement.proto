// Nillion Micropayment Protocol - Settlement Messages
// Version: 1.0.0
// Protocol Buffers v3

syntax = "proto3";

package nillion.payment.v1;

import "common.proto";

// ============================================================================
// SETTLEMENT OPERATIONS
// ============================================================================

// Client → Server: Manually trigger settlement
message InitiateSettlementRequest {
  string channel_id = 1;
  SettlementType type = 2; // MANUAL or CHANNEL_CLOSURE
}

// Server → Client: Settlement initiated
message InitiateSettlementResponse {
  string settlement_id = 1; // UUID
  string channel_id = 2;
  int32 payment_count = 3; // Number of payments being settled
  string total_amount = 4; // bigint as string
  string estimated_gas_cost = 5; // bigint as string
  string on_chain_tx_hash = 6; // Blockchain transaction hash
  int64 estimated_confirmation_seconds = 7;
}

// ============================================================================
// SETTLEMENT QUERIES
// ============================================================================

// Client → Server: Get settlement details
message GetSettlementRequest {
  string settlement_id = 1;
}

// Server → Client: Settlement details
message GetSettlementResponse {
  Settlement settlement = 1;
}

message Settlement {
  string id = 1; // UUID
  string channel_id = 2;
  ChainType chain_id = 3;
  SettlementType settlement_type = 4;
  int32 payment_count = 5;
  string total_amount = 6; // bigint as string
  string on_chain_tx_hash = 7;
  SettlementStatus status = 8;
  string gas_used = 9; // bigint as string
  string gas_cost = 10; // bigint as string
  int64 created_at = 11;
  int64 confirmed_at = 12; // 0 if not confirmed
}

// Client → Server: List settlements
message ListSettlementsRequest {
  string channel_id = 1; // Optional: filter by channel
  ChainType chain_filter = 2; // Optional: filter by chain
  SettlementStatus status_filter = 3; // Optional: filter by status
  int32 page = 4;
  int32 limit = 5;
}

// Server → Client: Settlement list
message ListSettlementsResponse {
  repeated Settlement settlements = 1;
  Pagination pagination = 2;
}

// ============================================================================
// SETTLEMENT EVENTS (Server-Initiated)
// ============================================================================

// Server → Client: Settlement confirmed on-chain
message SettlementConfirmed {
  string settlement_id = 1;
  string channel_id = 2;
  string on_chain_tx_hash = 3;
  int32 block_number = 4;
  int32 confirmations = 5;
  string gas_used = 6; // bigint as string
  string gas_cost = 7; // bigint as string
  int64 confirmed_at = 8;
}

// Server → Client: Settlement failed
message SettlementFailed {
  string settlement_id = 1;
  string channel_id = 2;
  ErrorCode error_code = 3;
  string error_message = 4;
  int64 timestamp = 5;
}

// Server → Client: Approaching settlement threshold
message SettlementThresholdWarning {
  string channel_id = 1;
  string current_balance = 2; // bigint as string
  string settlement_threshold = 3; // bigint as string
  string remaining_capacity = 4; // bigint as string
  int32 estimated_payments_until_settlement = 5;
}
