packages:
  # Applications
  - 'apps/*'

  # Shared packages
  - 'packages/*'

  # Documentation (if using VitePress or similar)
  - 'docs'

# Ensure all packages use the same version of critical dependencies
catalog:
  typescript: '5.3.3'
  '@types/node': '20.11.5'
  vitest: '1.3.0'
  eslint: '8.57.0'
  prettier: '3.2.5'
